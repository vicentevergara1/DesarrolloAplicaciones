<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotariaX - Ingreso</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
  <main class="card" style="max-width: 400px; margin: 40px auto; text-align: center;">
    <h1 style="color: var(--green);">NotariaX Móvil</h1>
    <p style="color: var(--ink-soft);">Accede a tus trámites notariales digitales</p>
    
    <form action="02_mis_tramites.html" method="GET" style="margin-top: 24px;">
      <div style="text-align: left; margin-bottom: 16px;">
        <label for="rut">RUT</label>
        <input type="text" id="rut" placeholder="12.345.678-9" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--line); border-radius: 6px;">
      </div>
      <div style="text-align: left; margin-bottom: 24px;">
        <label for="password">Contraseña / ClaveÚnica</label>
        <input type="password" id="password" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--line); border-radius: 6px;">
      </div>
      <button type="submit" class="btn-primary">Ingresar</button>
    </form>
  </main>
</body>
</html>
