<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotiX - Bienvenido</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="card" style="max-width: 400px; margin: 80px auto; text-align: center; padding: 36px 24px;">
    <!-- Branding NotiX -->
    <div style="margin-bottom: 32px;">
      <h1 style="color: var(--green); font-size: 2.8rem; margin: 0; letter-spacing: -1px;">NotiX</h1>
      <p style="color: var(--ink-soft); font-size: 15px; margin-top: 8px;">Trámites notariales simples y digitales</p>
    </div>

    <!-- Opciones principales -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <a href="views/persona/01_ingreso.html" class="btn-primary" style="display: block; text-decoration: none; text-align: center;">
        Iniciar Sesión
      </a>
      
      <a href="views/persona/01_ingreso.html?action=register" class="btn-flow" style="display: block; text-decoration: none; text-align: center; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);">
        Crear Cuenta
      </a>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--line); margin: 32px 0 20px 0;">

    <!-- Enlace notarios -->
    <a href="views/notario/01_dashboard_notario.html" style="color: var(--ink-soft); font-size: 13px; text-decoration: underline;">
      Acceso para Notarios y Ministros de Fe
    </a>
  </main>

</html>
